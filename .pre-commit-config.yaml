repos:
  # ── Python: ruff lint + format ───────────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/

      - id: ruff-format
        files: ^backend/

  # ── Python: SAST (bandit) ────────────────────────────────────────────────────
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: ["-c", "backend/pyproject.toml", "-r", "backend/app"]
        pass_filenames: false

  # ── JS/JSX: eslint + prettier ────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        language: node
        entry: bash -c 'cd frontend && npm run lint'
        files: ^frontend/.*\.[jt]sx?$
        pass_filenames: false

      - id: prettier
        name: prettier
        language: node
        entry: bash -c 'cd frontend && npm run format:check'
        files: ^frontend/
        pass_filenames: false

  # ── General ──────────────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
