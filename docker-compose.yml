services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: skillshare
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d skillshare"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      SSN_ENVIRONMENT: docker
      SSN_SECRET_KEY: change-me
      SSN_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/skillshare
      SSN_REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app  # Чтобы код обновлялся без пересборки контейнера
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules  # Важно: не перезаписывать модули внутри контейнера локальными
    environment:
      - CHOKIDAR_USEPOLLING=true # Помогает hot-reload работать внутри Docker
      - VITE_PROXY_TARGET=http://backend:8000
    depends_on:
      - backend

volumes:
  pg_data: