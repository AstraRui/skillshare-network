<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ request.app.title }}</title>

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/flyonui@1.2.2/dist/css/flyonui.min.css" rel="stylesheet" />
  </head>
  <body class="min-h-screen bg-base-200 text-base-content">
    <main class="mx-auto max-w-4xl px-6 py-10">
      <div class="rounded-box bg-base-100 p-8 shadow">
        <h1 class="text-3xl font-semibold">SkillShare Network</h1>
        <p class="mt-2 opacity-80">FastAPI + Jinja2/HTMX + Postgres + Redis</p>

        <div class="mt-6 flex flex-wrap gap-3">
          <a class="btn btn-primary" href="/api/health">/api/health</a>
          <button
            class="btn"
            hx-get="/api/health"
            hx-trigger="click"
            hx-target="#health"
            hx-swap="innerHTML"
          >
            Проверить через HTMX
          </button>
        </div>

        <pre id="health" class="mt-4 rounded-box bg-base-200 p-4 text-sm"></pre>

        <div class="divider my-8"></div>

        <div x-data="{ msg: '', log: [] }" class="space-y-3">
          <h2 class="text-xl font-semibold">WebSocket demo</h2>
          <div class="flex gap-2">
            <input class="input input-bordered w-full" placeholder="message" x-model="msg" />
            <button
              class="btn btn-secondary"
              @click="
                (async () => {
                  if (!window.__ws) {
                    window.__ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/api/v1/chat/ws');
                    window.__ws.onmessage = (e) => log.push(e.data);
                  }
                  window.__ws.send(msg);
                  msg = '';
                })()
              "
            >
              Send
            </button>
          </div>
          <div class="rounded-box bg-base-200 p-4 text-sm" x-text="log.join('\n')"></div>
        </div>
      </div>
    </main>
  </body>
</html>
