[project]
name = "skillshare-network-backend"
version = "0.1.0"
description = "SkillShare Network API (FastAPI + Postgres + Redis)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.136",
  "starlette>=1.0.1",
  "uvicorn[standard]>=0.30",
  "gunicorn>=22.0",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.13",
  "asyncpg>=0.29",
  "redis>=5.0",
  "bcrypt>=4.0",
  "pyjwt[crypto]>=2.13",
  "email-validator>=2.3.0",
  "idna>=3.15",
  "python-multipart>=0.0.9",
  "jinja2>=3.1",
]

[dependency-groups]
dev = [
  "ruff>=0.6",
  "pip-audit>=2.7",
  "bandit[toml]>=1.7",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  "alembic/versions",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.bandit]
exclude_dirs = ["tests", "alembic/versions"]
skips = ["B101"]

[tool.uv]
package = false
